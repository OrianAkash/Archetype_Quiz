<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a5ceca">
  <title>Which One Are You? — Archetype Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&family=Space+Mono:ital,wght@1,700&display=swap" rel="stylesheet">

  <style>
/* ============================================================
   ARCHETYPE QUIZ — "The Sorting" styles
   ------------------------------------------------------------
   Sage ground, oversized italic display type, badge-on-type
   layering, purple accent. Mobile first.

   Colours sampled from the design mockup:
     sage #a5ceca · teal #217d72 · purple #902c8f
   ============================================================ */

/* ---------- 1. Tokens ------------------------------------- */
:root {
  --sage:       #a5ceca;   /* the ground everything sits on */
  --sage-deep:  #8fbeb9;   /* inset frame, quiet dividers   */
  --teal:       #217d72;   /* structure: badges, outlines   */
  --teal-deep:  #17605a;   /* pressed states, type edge     */
  --purple:     #902c8f;   /* the one loud accent           */
  --purple-deep:#6f1f6e;
  --cream:      #fbfcfa;   /* cards, answer buttons         */
  --ink:        #173b37;   /* all reading text              */
  --ink-soft:   #4a6b66;

  /* Answer colours are fixed by POSITION, never by archetype,
     so the palette can never leak the scoring. Each one clears
     4.5:1 against white, checked rather than guessed. */
  --ans-a: #8b2b8a;  --ans-a-deep: #6b1f6a;
  --ans-b: #1d7268;  --ans-b-deep: #12564e;
  --ans-c: #c0492c;  --ans-c-deep: #97371f;
  --ans-d: #97701a;  --ans-d-deep: #755511;

  --radius:      18px;
  --radius-pill: 999px;

  --font-display: 'Poppins', 'Trebuchet MS', system-ui, sans-serif;
  --font-mono:    'Space Mono', ui-monospace, 'Courier New', monospace;
}

/* ---------- 2. Base --------------------------------------- */
* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  color: var(--ink);
  background: var(--sage);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

/* The inset frame from the mockup. Decorative only. */
body::after {
  content: '';
  position: fixed;
  inset: 7px;
  border: 2px solid var(--sage-deep);
  border-radius: 6px;
  pointer-events: none;
  z-index: 3;
}
@media (max-width: 480px) { body::after { inset: 5px; } }

/* ---------- 3. Layout ------------------------------------- */
.stage {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* Auto margins centre without clipping when content is taller
     than the viewport; justify-content:center would cut the top
     off beyond the reach of the scrollbar. */
  justify-content: flex-start;
  padding: 22px 18px 50px;
}

.screen { display: none; width: 100%; max-width: 470px; }
.screen.is-active {
  display: block;
  margin-block: auto;
  animation: rise .34s cubic-bezier(.2,.9,.3,1) both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ---------- 4. The title lockup --------------------------- */
/* Eyebrow badge overlapping an oversized italic wordmark, with
   a mono pill beneath — the mockup's three-part stack. */
.lockup {
  position: relative;
  /* Above the card, so the characters overlap it like stickers rather
     than being clipped behind its top edge. */
  z-index: 4;
  text-align: center;
  margin-bottom: 20px;
  /* Heavy italics paint outside their advance width — the 'g' tail and the
     slant both overshoot. This gutter keeps the ink off the screen edge. */
  padding-inline: 10px;
}

.lockup__eyebrow {
  display: inline-block;
  position: relative;
  z-index: 2;
  font-weight: 800;
  font-style: italic;
  font-size: clamp(26px, 9vw, 44px);
  line-height: 1;
  letter-spacing: -.02em;
  color: #fff;
  background: var(--teal);
  border-radius: 14px;
  padding: 8px 18px 10px;
  margin-bottom: -14px;
  margin-right: 34%;
}

.lockup__word {
  display: block;
  position: relative;
  z-index: 1;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(46px, 17vw, 88px);
  line-height: .88;
  letter-spacing: -.045em;
  color: #fff;
  /* White on sage is only 1.71:1 — far too low on its own. The
     dark edge is what makes this readable, not decoration. */
  -webkit-text-stroke: 2px var(--teal-deep);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 rgba(23,59,55,.16);
  margin: 0;
}

.lockup__pill {
  display: inline-block;
  position: relative;
  z-index: 2;
  font-family: var(--font-mono);
  font-weight: 700;
  font-style: italic;
  font-size: clamp(13px, 3.6vw, 19px);
  letter-spacing: -.01em;
  color: #fff;
  background: var(--purple);
  border-radius: var(--radius-pill);
  padding: 7px 20px 8px;
  margin-top: -3px;
  margin-left: 12%;
}

/* Mascots scattered around the lockup, as in the mockup. */
.lockup__pets { position: absolute; inset: 0; pointer-events: none; }
.lockup__pets img {
  position: absolute;
  display: block;
  /* Sized by HEIGHT, not width — the four characters have different
     natural proportions and matching their heights is what makes them
     read as a set. */
  height: clamp(58px, 17vw, 96px);
  width: auto;
  filter: drop-shadow(0 3px 2px rgba(23,59,55,.18));
  animation: float 4.2s ease-in-out infinite;
}
.lockup__pets img:nth-child(1) { left: -2%;  top: -2%;    transform: rotate(-8deg); }
.lockup__pets img:nth-child(2) { right: -2%; top: -8%;    transform: rotate(7deg);  animation-delay: .5s; }
.lockup__pets img:nth-child(3) { left: 0;    bottom: -14%; transform: rotate(6deg);  animation-delay: 1s; }
.lockup__pets img:nth-child(4) { right: 0;   bottom: -16%; transform: rotate(-6deg); animation-delay: 1.5s; }

@keyframes float {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -7px; }
}

/* ---------- 5. Cards & type ------------------------------- */
.card {
  background: var(--cream);
  border: 2px solid var(--teal);
  border-radius: var(--radius);
  box-shadow: 0 5px 0 var(--teal);
  padding: 24px 22px;
  text-align: center;
}

h1, h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-style: italic;
  line-height: 1.05;
  letter-spacing: -.03em;
  margin: 0 0 10px;
  color: var(--ink);
  text-wrap: balance;
}
h1 { font-size: clamp(28px, 7.5vw, 38px); }
h2 { font-size: clamp(21px, 5.4vw, 27px); }

p {
  margin: 0 0 14px;
  line-height: 1.55;
  font-size: 15.5px;
  font-weight: 500;
  color: var(--ink-soft);
}
p:last-child { margin-bottom: 0; }

/* Small mono labels, the mockup's secondary voice. */
.label {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .04em;
  text-transform: lowercase;
}

/* ---------- 6. Buttons ------------------------------------ */
.btn {
  display: block;
  width: 100%;
  font-family: var(--font-display);
  font-weight: 700;
  font-style: italic;
  font-size: 18px;
  letter-spacing: -.01em;
  color: #fff;
  background: var(--purple);
  border: 2px solid var(--teal-deep);
  border-radius: var(--radius-pill);
  box-shadow: 0 5px 0 var(--purple-deep);
  padding: 13px 20px;
  cursor: pointer;
  transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
  -webkit-appearance: none;
  touch-action: manipulation;
}
@media (hover: hover) {
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
}
.btn:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--purple-deep);
}
.btn:focus-visible { outline: 3px solid var(--teal-deep); outline-offset: 3px; }
.btn:disabled { opacity: .42; cursor: not-allowed; }

.btn--ghost {
  background: var(--cream);
  color: var(--ink);
  border-color: var(--teal);
  box-shadow: 0 5px 0 var(--sage-deep);
  font-size: 15px;
  padding: 11px 18px;
}
.btn--ghost:active:not(:disabled) { box-shadow: 0 1px 0 var(--sage-deep); }

/* ---------- 7. Name form ---------------------------------- */
.field { text-align: left; margin-bottom: 15px; }

.field label {
  display: block;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: .02em;
  color: var(--teal);
  margin-bottom: 6px;
}
.field .hint {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 12.5px;
  letter-spacing: 0;
  color: var(--ink-soft);
}

.field input {
  width: 100%;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 17px;               /* 16px+ stops iOS auto-zoom on focus */
  color: var(--ink);
  background: #fff;
  border: 2px solid var(--teal);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--sage-deep);
  padding: 11px 13px;
  touch-action: manipulation;
}
.field input:focus { outline: 3px solid var(--purple); outline-offset: 1px; }
.field input.is-invalid { border-color: var(--ans-c); box-shadow: 0 3px 0 var(--ans-c-deep); }

.error {
  display: none;
  font-family: var(--font-mono);
  color: var(--ans-c-deep);
  font-size: 12.5px;
  font-weight: 700;
  margin-top: 6px;
}
.error.is-shown { display: block; }

/* ---------- 8. Question screen ---------------------------- */
.progress { margin-bottom: 14px; text-align: center; }

.progress__label {
  display: inline-block;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: .02em;
  color: #fff;
  background: var(--teal);
  border-radius: var(--radius-pill);
  padding: 4px 15px;
  margin-bottom: 8px;
}

.progress__track {
  height: 10px;
  background: var(--cream);
  border: 2px solid var(--teal);
  border-radius: var(--radius-pill);
  overflow: hidden;
}
.progress__fill {
  height: 100%;
  width: 0;
  background: var(--purple);
  border-radius: var(--radius-pill);
  transition: width .35s cubic-bezier(.3,1,.4,1);
}

.question-text {
  font-family: var(--font-display);
  font-weight: 800;
  font-style: italic;
  font-size: clamp(20px, 5.2vw, 26px);
  line-height: 1.2;
  letter-spacing: -.025em;
  text-align: center;
  text-wrap: balance;
  margin: 0 0 18px;
  color: #fff;
  -webkit-text-stroke: 1.4px var(--teal-deep);
  paint-order: stroke fill;
  text-shadow: 0 3px 0 rgba(23,59,55,.14);
}

.answers { display: grid; gap: 10px; margin-bottom: 16px; }

/* Cream buttons with a coloured letter chip, rather than four
   solid colour blocks — keeps the sage/purple scheme calm and
   gives every answer the same high text contrast. */
.answer {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15.5px;
  line-height: 1.35;
  color: var(--ink);
  background: var(--cream);
  border: 2px solid var(--teal);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--sage-deep);
  padding: 12px 14px;
  cursor: pointer;
  transition: transform .08s ease, box-shadow .08s ease, background .12s ease, color .12s ease;
  -webkit-appearance: none;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.answer:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sage-deep); }
.answer:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }

.answer__glyph {
  flex: 0 0 auto;
  width: 30px; height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  transition: background .12s ease, color .12s ease;
}

.answer--a .answer__glyph { background: var(--ans-a); }
.answer--b .answer__glyph { background: var(--ans-b); }
.answer--c .answer__glyph { background: var(--ans-c); }
.answer--d .answer__glyph { background: var(--ans-d); }

/* Picked: the chip's colour floods the whole button. */
.answer.is-picked { color: #fff; }
.answer.is-picked .answer__glyph { background: rgba(255,255,255,.22); }
.answer.is-picked .answer__glyph::after { content: '✓'; }
.answer.is-picked .answer__glyph span { display: none; }

.answer--a.is-picked { background: var(--ans-a); border-color: var(--ans-a-deep); box-shadow: 0 4px 0 var(--ans-a-deep); }
.answer--b.is-picked { background: var(--ans-b); border-color: var(--ans-b-deep); box-shadow: 0 4px 0 var(--ans-b-deep); }
.answer--c.is-picked { background: var(--ans-c); border-color: var(--ans-c-deep); box-shadow: 0 4px 0 var(--ans-c-deep); }
.answer--d.is-picked { background: var(--ans-d); border-color: var(--ans-d-deep); box-shadow: 0 4px 0 var(--ans-d-deep); }

.nav { display: flex; gap: 10px; }
.nav .btn { flex: 1; }
.nav .btn--ghost { flex: 0 0 92px; }

/* ---------- 9. Finish screen ------------------------------ */
.finish-mascots {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 2px;
  margin-bottom: -10px;
  position: relative;
  z-index: 2;
}
.finish-mascots img {
  display: block;
  height: 74px;
  width: auto;
  filter: drop-shadow(0 3px 2px rgba(23,59,55,.18));
  animation: float 4s ease-in-out infinite;
}
.finish-mascots img:nth-child(1) { transform: rotate(-7deg); }
.finish-mascots img:nth-child(2) { transform: rotate(5deg);  animation-delay: .4s; }
.finish-mascots img:nth-child(3) { transform: rotate(-4deg); animation-delay: .8s; }
.finish-mascots img:nth-child(4) { transform: rotate(8deg);  animation-delay: 1.2s; }

.finish-name {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  color: var(--purple);
  margin-bottom: 6px;
}

.tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--teal);
  background: #e7f1ef;
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  margin-top: 12px;
}
.tag--warn { background: #fbecd9; color: #8a5a12; }

/* ---------- 10. Loading ----------------------------------- */
.spinner {
  width: 38px; height: 38px;
  margin: 4px auto 16px;
  border: 4px solid var(--sage-deep);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 11. Confetti ---------------------------------- */
.confetti {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  overflow: hidden;
}
.confetti i {
  position: absolute;
  top: -12vh;
  width: 9px; height: 13px;
  border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(115vh) rotate(760deg); opacity: .85; }
}

/* ---------- 12. Footer ------------------------------------ */
.credit {
  position: fixed;
  bottom: 12px; left: 0; right: 0;
  z-index: 1;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: rgba(23,59,55,.42);
}

/* ---------- 13. Larger screens ---------------------------- */
@media (min-width: 620px) {
  .card { padding: 30px 30px; }
  .answer { font-size: 16.5px; padding: 14px 16px; }
  .lockup { margin-bottom: 26px; }
}

/* ---------- 14. Small phones ------------------------------ */
@media (max-height: 720px) {
  .stage { padding: 12px 14px 36px; }
  .card { padding: 18px 16px; }
  .lockup { margin-bottom: 12px; }
  .progress { margin-bottom: 10px; }
  .question-text { font-size: clamp(18px, 4.8vw, 22px); margin-bottom: 12px; }
  .answers { gap: 8px; margin-bottom: 12px; }
  .answer { padding: 10px 12px; line-height: 1.3; }
  .credit { display: none; }
}

@media (max-width: 361px) {
  .answer { font-size: 14.5px; gap: 10px; padding: 10px 11px; }
  .answer__glyph { width: 26px; height: 26px; font-size: 13px; }
  .question-text { font-size: 18px; }
}

@media (max-height: 460px) and (orientation: landscape) {
  .stage { padding: 10px 14px 18px; }
  .screen.is-active { margin-block: 0; }
  .lockup__pets { display: none; }
}

/* Reserve the character art's space so nothing jumps as it loads. */
img { max-width: 100%; }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

</style>
</head>

  <!-- ---------- 2. NAME ---------- -->
  <section id="screen-name" class="screen">
    <div class="card">
      <h2>First, who are you?</h2>
      <p>So we can find your result when it's time to reveal.</p>

      <form id="name-form" novalidate>
        <div class="field">
          <label for="input-player-name">
            Display name
            <span class="hint">— what we'll call out</span>
          </label>
          <input id="input-player-name" name="playerName" type="text"
                 maxlength="40" autocomplete="nickname"
                 placeholder="e.g. Ori" required>
          <p class="error" id="error-player-name">Please enter a display name.</p>
        </div>

        <div class="field" id="field-real-name">
          <label for="input-real-name">
            Full name
            <span class="hint">— so we know it's really you</span>
          </label>
          <input id="input-real-name" name="realName" type="text"
                 maxlength="60" autocomplete="name"
                 placeholder="e.g. Orian Akash" required>
          <p class="error" id="error-real-name">Please enter your full name.</p>
        </div>

        <button id="btn-to-quiz" class="btn" type="submit">Let's go</button>
      </form>
    </div>

/* ===== js/scoring.js ===== */
/* ============================================================
   SCORING
   ------------------------------------------------------------
   One pure function. No DOM, no network — which is what makes
   it testable (see test/scoring.test.js) and safe to reuse.
   ============================================================ */

/**
 * Turn a list of picked option indexes into archetype scores.
 *
 * @param {number[]} answers  answers[i] = index of the option picked
 *                            for questions[i]. null/undefined = skipped.
 * @param {object}   data     the QUIZ_DATA object.
 * @returns {{scores:object, hits:object, archetype:string,
 *            archetypeLabel:string, tie:boolean, tiedWith:string[]}}
 */
function scoreQuiz(answers, data) {
  const ids = data.archetypes.map(a => a.id);

  const scores = {};
  const hits = {};              // how many questions each archetype scored on
  ids.forEach(id => { scores[id] = 0; hits[id] = 0; });

  answers.forEach((optIndex, qIndex) => {
    const question = data.questions[qIndex];
    if (!question) return;
    if (optIndex === null || optIndex === undefined) return;

    const option = question.options[optIndex];
    if (!option || !option.scores) return;

    Object.keys(option.scores).forEach(id => {
      if (!(id in scores)) return;          // ignore unknown archetype ids
      const points = Number(option.scores[id]) || 0;
      scores[id] += points;
      if (points > 0) hits[id] += 1;
    });
  });

  /* ---- pick a winner ------------------------------------------------
     1. highest total
     2. tie-break: whoever scored across the most questions (broad fit
        beats one lucky spike)
     3. still tied: first in the archetypes array, and we flag it so the
        host can pick by hand at the reveal.
     ------------------------------------------------------------------ */
  const top = Math.max(...ids.map(id => scores[id]));
  let candidates = ids.filter(id => scores[id] === top);
  const trueTie = candidates.length > 1;

  if (candidates.length > 1) {
    const mostHits = Math.max(...candidates.map(id => hits[id]));
    candidates = candidates.filter(id => hits[id] === mostHits);
  }

  const winner = candidates[0];
  const winnerMeta = data.archetypes.find(a => a.id === winner);

  return {
    scores,
    hits,
    archetype: winner,
    archetypeLabel: winnerMeta ? winnerMeta.label : winner,
    tie: trueTie,
    tiedWith: trueTie ? ids.filter(id => scores[id] === top) : []
  };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { scoreQuiz };
}

(function () {

  /* ---------- element lookups ------------------------------ */
  const $ = id => document.getElementById(id);

    doneHeading:   $('done-heading'),
    doneBody:      $('done-body'),
    doneTag:       $('done-tag'),
    confetti:      $('confetti')
  };

  const STORAGE_KEY  = 'archetypeQuiz.pending';   // localStorage: failed sends
  const PROGRESS_KEY = 'archetypeQuiz.progress';  // sessionStorage: this attempt
  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
  const SLOT_CLASS = ['answer--a', 'answer--b', 'answer--c', 'answer--d',
                      'answer--a', 'answer--b'];

  /* ---------- guard: did quiz-data.js load cleanly? ---------
     A stray comma or missing brace in quiz-data.js stops the whole
     file parsing, and without this you'd get a page that looks fine
     until Start does nothing — with the real reason buried in the
     browser console. Say it out loud on the page instead.
     ---------------------------------------------------------- */
  function checkQuizData() {
    if (typeof QUIZ_DATA === 'undefined') {
      return ['js/quiz-data.js could not be read at all. That is almost ' +
              'always a missing comma, quote or closing brace.'];
    }

    var problems = [];
    if (!QUIZ_DATA.questions || !QUIZ_DATA.questions.length) {
      problems.push('There are no questions in the file.');
      return problems;
    }
    if (!QUIZ_DATA.archetypes || !QUIZ_DATA.archetypes.length) {
      problems.push('There are no archetypes in the file.');
      return problems;
    }

    var ids = QUIZ_DATA.archetypes.map(function (a) { return a.id; });

    QUIZ_DATA.questions.forEach(function (q, i) {
      var where = 'Question ' + (i + 1);
      if (!q.text) problems.push(where + ' has no question text.');
      if (!q.options || q.options.length < 2) {
        problems.push(where + ' needs at least two options.');
        return;
      }
      q.options.forEach(function (opt, j) {
        var slot = where + ', option ' + (LETTERS[j] || j + 1);
        if (!opt.text) problems.push(slot + ' has no text.');
        if (!opt.scores || !Object.keys(opt.scores).length) {
          problems.push(slot + ' does not give points to anything.');
          return;
        }
        Object.keys(opt.scores).forEach(function (id) {
          if (ids.indexOf(id) === -1) {
            problems.push(slot + ' scores "' + id + '", which is not one of: ' +
                          ids.join(', '));
          }
        });
      });
    });

    return problems;
  }

  function showDataError(problems) {
    var box = document.createElement('div');
    box.className = 'card';
    box.style.textAlign = 'left';
    box.style.maxWidth = '460px';
    box.style.margin = '0 auto';

    var list = problems.slice(0, 8).map(function (p) {
      return '<li>' + p.replace(/</g, '&lt;') + '</li>';
    }).join('');

    box.innerHTML =
      '<h2 style="text-align:center">The questions need a fix</h2>' +
      '<p>Something in <strong>js/quiz-data.js</strong> isn\'t right, so the ' +
      'quiz can\'t start:</p>' +
      '<ul style="padding-left:20px;line-height:1.6">' + list + '</ul>' +
      (problems.length > 8 ? '<p>…and ' + (problems.length - 8) + ' more.</p>' : '') +
      '<p style="margin-top:12px">Fix the file, save, and reload this page.</p>';

    var stage = document.querySelector('.stage');
    stage.innerHTML = '';
    stage.appendChild(box);
  }

  var dataProblems = checkQuizData();
  if (dataProblems.length) {
    showDataError(dataProblems);
    console.error('quiz-data.js problems:', dataProblems);
    return;
  }

  /* ---------- state ---------------------------------------- */
  const state = {
    playerId:   makeId(),
    playerName: '',
    realName:   '',
    answers:    new Array(QUIZ_DATA.questions.length).fill(null),
    index:      0,
    submitting: false
  };

  /* ============================================================
     Helpers
     ============================================================ */

  function makeId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'p-' + Date.now().toString(36) + '-' +

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('is-active'));
    screens[name].classList.add('is-active');
    window.scrollTo(0, 0);
  }

  /* localStorage can throw (private mode, blocked cookies, embedded
     previews). Every access goes through these two, and the quiz
     works perfectly well if both silently do nothing. */
  function storeGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storeSet(key, value) {
    try { window.localStorage.setItem(key, value); return true; }
    catch (e) { return false; }
  }

  /* Progress uses sessionStorage on purpose, not localStorage. A phone
     gets passed around at a mixer — session scope means a reload resumes
     your own quiz, but a fresh tab starts clean for the next person. */
  function saveProgress() {
    try {
      window.sessionStorage.setItem(PROGRESS_KEY, JSON.stringify({
        playerId:   state.playerId,
        playerName: state.playerName,
        realName:   state.realName,
        answers:    state.answers,
        index:      state.index
      }));
    } catch (e) { /* private mode — progress just won't survive a reload */ }
  }

  function clearProgress() {
    try { window.sessionStorage.removeItem(PROGRESS_KEY); } catch (e) {}
  }

  function restoreProgress() {
    let saved;
    try { saved = JSON.parse(window.sessionStorage.getItem(PROGRESS_KEY) || 'null'); }
    catch (e) { return false; }

    if (!saved || !saved.playerName) return false;
    // Question count changed since they started — the saved answers no
    // longer line up with the questions, so don't pretend they do.
    if (!Array.isArray(saved.answers) ||
        saved.answers.length !== QUIZ_DATA.questions.length) {
      clearProgress();
      return false;
    }

    state.playerId   = saved.playerId || state.playerId;
    state.playerName = saved.playerName;
    state.realName   = saved.realName || '';
    state.answers    = saved.answers;
    state.index      = Math.min(saved.index || 0, QUIZ_DATA.questions.length - 1);
    return true;
  }

  /* ============================================================
     Welcome
     ============================================================ */

  // The lockup is three separate pieces of type, so each is its own field.
  if (els.welcomeEyebrow) els.welcomeEyebrow.textContent = QUIZ_DATA.meta.eyebrow || 'the';
  els.welcomeTitle.textContent = QUIZ_DATA.meta.title;
  if (els.welcomeBadge) els.welcomeBadge.textContent = QUIZ_DATA.meta.badge || 'personality quiz';
  els.welcomeSub.textContent   = QUIZ_DATA.meta.subtitle;
  els.btnStart.textContent     = QUIZ_DATA.meta.startLabel;

  if (!CONFIG.askRealName) els.fieldReal.hidden = true;
  if (!CONFIG.showProgress) els.progress.style.display = 'none';

  els.btnStart.addEventListener('click', () => {
    show('name');
    setTimeout(() => els.inputPlayer.focus(), 260);
  });

  /* ============================================================
     Name form
     ============================================================ */

  function markInvalid(input, errorEl, isBad) {
    input.classList.toggle('is-invalid', isBad);
    errorEl.classList.toggle('is-shown', isBad);
  }

  els.nameForm.addEventListener('submit', e => {
    e.preventDefault();

    const player = els.inputPlayer.value.trim();
    const real   = CONFIG.askRealName ? els.inputReal.value.trim() : '';

    const badPlayer = player.length === 0;
    const badReal   = CONFIG.askRealName && real.length === 0;

    markInvalid(els.inputPlayer, els.errPlayer, badPlayer);
    if (CONFIG.askRealName) markInvalid(els.inputReal, els.errReal, badReal);

    if (badPlayer) { els.inputPlayer.focus(); return; }
    if (badReal)   { els.inputReal.focus();   return; }

    state.playerName = player;
    state.realName   = real;

    state.index = 0;
    saveProgress();
    renderQuestion();
    show('question');
  });

  [els.inputPlayer, els.inputReal].forEach(input => {
    input.addEventListener('input', () => {
      input.classList.remove('is-invalid');
      const err = input === els.inputPlayer ? els.errPlayer : els.errReal;
      err.classList.remove('is-shown');
    });
  });

  /* ============================================================
     Questions
     ============================================================ */

  function renderQuestion() {
    const total = QUIZ_DATA.questions.length;
    const q = QUIZ_DATA.questions[state.index];

    els.progressLabel.textContent = 'Question ' + (state.index + 1) + ' of ' + total;
    // (index + 1) so question 1 already shows a sliver of progress —
    // an empty bar on the first screen reads as broken.
    els.progressFill.style.width = (((state.index + 1) / total) * 100) + '%';

    els.questionText.textContent = q.text;

    els.answers.innerHTML = '';
    q.options.forEach((option, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'answer ' + (SLOT_CLASS[i] || 'answer--a');
      btn.setAttribute('role', 'radio');
      btn.setAttribute('aria-checked', state.answers[state.index] === i ? 'true' : 'false');
      if (state.answers[state.index] === i) btn.classList.add('is-picked');

      const glyph = document.createElement('span');
      glyph.className = 'answer__glyph';
      const letter = document.createElement('span');
      letter.textContent = LETTERS[i] || (i + 1);
      glyph.appendChild(letter);

      const label = document.createElement('span');
      label.className = 'answer__text';
      label.textContent = option.text;

      btn.append(glyph, label);
      btn.addEventListener('click', () => pick(i));
      els.answers.appendChild(btn);
    });

    // display:none, not visibility:hidden — otherwise the hidden Back
    // button keeps its slot and shoves Next off-centre on question 1.
    const showBack = CONFIG.allowBack && state.index > 0;
    els.btnBack.style.display = showBack ? '' : 'none';
    els.btnNext.disabled = state.answers[state.index] === null;
    els.btnNext.textContent =
      state.index === total - 1 ? 'Finish' : 'Next';
  }

  function pick(optionIndex) {
    state.answers[state.index] = optionIndex;

    els.answers.querySelectorAll('.answer').forEach((btn, i) => {
      const on = i === optionIndex;
      btn.classList.toggle('is-picked', on);
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
    });

    els.btnNext.disabled = false;
    saveProgress();
  }

  els.btnNext.addEventListener('click', () => {
    if (state.answers[state.index] === null) return;

    if (state.index < QUIZ_DATA.questions.length - 1) {
      state.index += 1;
      saveProgress();
      renderQuestion();
      screens.question.classList.remove('is-active');
      void screens.question.offsetWidth;      // restart the pop animation
      screens.question.classList.add('is-active');
    } else {
      finish();
    }
  });

  els.btnBack.addEventListener('click', () => {
    if (state.index === 0) return;
    state.index -= 1;
    saveProgress();
    renderQuestion();
  });

  /* Keyboard: 1-4 or A-D to answer, Enter to advance. */
  document.addEventListener('keydown', e => {
    if (!screens.question.classList.contains('is-active')) return;
    const q = QUIZ_DATA.questions[state.index];

    const numeric = parseInt(e.key, 10);
    if (numeric >= 1 && numeric <= q.options.length) { pick(numeric - 1); return; }

    const alphaIndex = LETTERS.indexOf(e.key.toUpperCase());
    if (alphaIndex > -1 && alphaIndex < q.options.length) { pick(alphaIndex); return; }

    if (e.key === 'Enter' && !els.btnNext.disabled) els.btnNext.click();
  });

  /* ============================================================
     Finish + submit
     ============================================================ */

  function buildPayload() {
    const result = scoreQuiz(state.answers, QUIZ_DATA);

    return {
      playerId:       state.playerId,
      playerName:     state.playerName,
      realName:       state.realName,
      archetype:      result.archetype,
      archetypeLabel: result.archetypeLabel,
      scores:         result.scores,
      tie:            result.tie,
      tiedWith:       result.tiedWith,
      answers:        state.answers,
      answerLabels:   state.answers.map((optIndex, qIndex) => {
        const q = QUIZ_DATA.questions[qIndex];
        if (!q || optIndex === null) return '';
        return (q.options[optIndex] || {}).text || '';
      }),
      questionCount:  QUIZ_DATA.questions.length,
      clientTime:     new Date().toISOString()
    };
  }

  async function finish() {
    if (state.submitting) return;
    state.submitting = true;

    els.progressFill.style.width = '100%';
    const payload = buildPayload();

    show('sending');

    const outcome = await submit(payload);

    els.doneName.textContent    = 'Thanks, ' + state.playerName + '!';
    els.doneHeading.textContent = QUIZ_DATA.meta.finishHeading;
    els.doneBody.textContent    = QUIZ_DATA.meta.finishBody;

    if (outcome === 'queued') {
      els.doneTag.textContent = 'Saved on this device — it will send when you\'re back online';
      els.doneTag.classList.add('tag--warn');
    } else if (outcome === 'demo') {
      els.doneTag.textContent = 'Demo mode — nothing was sent (see the console)';
      els.doneTag.classList.add('tag--warn');
    } else {
      els.doneTag.textContent = 'Sit tight — no peeking';
    }

    clearProgress();
    show('done');
    confetti();
    state.submitting = false;
  }

  /**
   * Returns 'sent' | 'queued' | 'demo'.
   *
   * Apps Script and CORS: sending as text/plain keeps this a "simple"
   * request, so the browser skips the preflight OPTIONS that Apps
   * Script cannot answer. If the response still can't be read, we
   * resend with mode:'no-cors' — the script receives it fine, we just
   * can't see the reply, which is an acceptable trade at a mixer.
   */
  async function submit(payload) {
    if (!CONFIG.endpoint) {
      console.log('[DEMO MODE] nothing sent. Payload was:', payload);
      console.table(payload.scores);
      return 'demo';
    }

    const body = JSON.stringify(payload);

    try {
      const res = await fetch(CONFIG.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body,
        redirect: 'follow'
      });
      if (res.ok) return 'sent';
      throw new Error('HTTP ' + res.status);
    } catch (err) {
      console.warn('Readable POST failed, retrying fire-and-forget:', err);
    }

    try {
      await fetch(CONFIG.endpoint, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body
      });
      return 'sent';
    } catch (err) {
      console.error('Submission failed, queueing locally:', err);
    }

    if (CONFIG.retryFailedSubmissions) queue(payload);
    return 'queued';
  }

  function queue(payload) {
    let pending = [];
    try { pending = JSON.parse(storeGet(STORAGE_KEY) || '[]'); } catch (e) { pending = []; }
    pending.push(payload);
    storeSet(STORAGE_KEY, JSON.stringify(pending));
  }

  /* On load, try to flush anything stranded by an earlier drop-out. */
  async function flushQueue() {
    if (!CONFIG.endpoint || !CONFIG.retryFailedSubmissions) return;

    let pending = [];
    try { pending = JSON.parse(storeGet(STORAGE_KEY) || '[]'); } catch (e) { return; }
    if (!pending.length) return;

    const stillPending = [];
    for (const payload of pending) {
      try {
        await fetch(CONFIG.endpoint, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        stillPending.push(payload);
      }
    }
    storeSet(STORAGE_KEY, JSON.stringify(stillPending));
    if (pending.length !== stillPending.length) {
      console.log('Flushed ' + (pending.length - stillPending.length) + ' queued submission(s).');
    }
  }

  /* ============================================================
     Confetti
     ============================================================ */

  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const colours = ['#902c8f', '#1d7268', '#c0492c', '#97701a', '#fbfcfa', '#e4443c'];
    const frag = document.createDocumentFragment();

    for (let i = 0; i < 64; i++) {
      const bit = document.createElement('i');
      bit.style.left            = Math.random() * 100 + 'vw';
      bit.style.background      = colours[i % colours.length];
      bit.style.animationDelay  = (Math.random() * 1.4) + 's';
      bit.style.animationDuration = (2.6 + Math.random() * 2.2) + 's';
      bit.style.transform       = 'rotate(' + (Math.random() * 360) + 'deg)';
      if (i % 3 === 0) bit.style.borderRadius = '50%';
      frag.appendChild(bit);
    }
    els.confetti.appendChild(frag);
    setTimeout(() => { els.confetti.innerHTML = ''; }, 7000);
  }

  /* ============================================================
     Go
     ============================================================ */

  flushQueue();

  /* A phone browser can drop a backgrounded tab at any moment. If this
     one comes back mid-quiz, put them where they left off rather than
     making them start over. */
  if (restoreProgress()) {
    renderQuestion();
    show('question');
  }

  /* Belt and braces: warn before a refresh, since restore only covers
     the same tab. */
  window.addEventListener('beforeunload', e => {
    const started = state.answers.some(a => a !== null);
    const finished = screens.done.classList.contains('is-active');
    if (started && !finished) { e.preventDefault(); e.returnValue = ''; }
  });

  /* Save on the way out too — pagehide is the one event iOS reliably
     fires when a tab is backgrounded or discarded. */
  window.addEventListener('pagehide', () => {
    const started = state.answers.some(a => a !== null);
    if (started && !screens.done.classList.contains('is-active')) saveProgress();
  });

})();

</script>
</body>
