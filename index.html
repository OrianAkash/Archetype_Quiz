<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a5ceca">
  <title>Which One Are You? — Archetype Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&family=Space+Mono:ital,wght@1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     SCREENS
     ============================================================ -->
<main class="stage">

  <!-- ---------- 1. WELCOME ---------- -->
  <section id="screen-welcome" class="screen is-active">
    <div class="lockup">
      <div class="lockup__pets" aria-hidden="true">
        <img src="img/hummingbird.png" alt="" width="334" height="420">
        <img src="img/cat.png" alt="" width="290" height="420">
        <img src="img/monkey.png" alt="" width="406" height="420">
        <img src="img/turtle.png" alt="" width="321" height="420">
      </div>

      <span class="lockup__eyebrow" id="welcome-eyebrow">the</span>
      <h1 class="lockup__word" id="welcome-title">sorting</h1>
      <span class="lockup__pill" id="welcome-badge">personality quiz</span>
    </div>

    <div class="card">
      <p id="welcome-subtitle"></p>
      <button id="btn-start" class="btn" type="button">Start the quiz</button>
    </div>
  </section>

  <!-- ---------- 2. NAME ---------- -->
  <section id="screen-name" class="screen">
    <div class="card">
      <h2>First, who are you?</h2>
      <p>So we can find your result when it's time to reveal.</p>

      <form id="name-form" novalidate>
        <div class="field">
          <label for="input-player-name">
            Display name
            <span class="hint">— what we'll call out</span>
          </label>
          <input id="input-player-name" name="playerName" type="text"
                 maxlength="40" autocomplete="nickname"
                 placeholder="e.g. Ori" required>
          <p class="error" id="error-player-name">Please enter a display name.</p>
        </div>

        <div class="field" id="field-real-name">
          <label for="input-real-name">
            Full name
            <span class="hint">— so we know it's really you</span>
          </label>
          <input id="input-real-name" name="realName" type="text"
                 maxlength="60" autocomplete="name"
                 placeholder="e.g. Orian Akash" required>
          <p class="error" id="error-real-name">Please enter your full name.</p>
        </div>

        <button id="btn-to-quiz" class="btn" type="submit">Let's go</button>
      </form>
    </div>
  </section>

  <!-- ---------- 3. QUESTION ---------- -->
  <section id="screen-question" class="screen" aria-live="polite">
    <div class="progress" id="progress">
      <span class="progress__label" id="progress-label">Question 1 of 10</span>
      <div class="progress__track">
        <div class="progress__fill" id="progress-fill"></div>
      </div>
    </div>

    <h2 class="question-text" id="question-text">&nbsp;</h2>

    <div class="answers" id="answers" role="radiogroup" aria-labelledby="question-text"></div>

    <div class="nav">
      <button id="btn-back" class="btn btn--ghost" type="button">Back</button>
      <button id="btn-next" class="btn" type="button" disabled>Next</button>
    </div>
  </section>

  <!-- ---------- 4. SENDING ---------- -->
  <section id="screen-sending" class="screen">
    <div class="card">
      <div class="spinner"></div>
      <h2>Saving your answers…</h2>
      <p>One moment.</p>
    </div>
  </section>

  <!-- ---------- 5. DONE ---------- -->
  <section id="screen-done" class="screen">
    <div class="finish-mascots">
      <img src="img/hummingbird.png" alt="Humming Bird" width="334" height="420">
      <img src="img/cat.png" alt="Cat" width="290" height="420">
      <img src="img/monkey.png" alt="Monkey" width="406" height="420">
      <img src="img/turtle.png" alt="Turtle" width="321" height="420">
    </div>

    <div class="card">
      <p class="finish-name" id="done-name"></p>
      <h2 id="done-heading">You're done!</h2>
      <p id="done-body"></p>
      <p class="tag" id="done-tag">Sit tight — no peeking</p>
    </div>
  </section>

</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<p class="credit">Made for the mixer</p>

<script src="js/config.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/scoring.js"></script>
<script src="js/app.js"></script>
</body>
</html>
